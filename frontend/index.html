<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css" />

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1 data-i18n="appTitle">To-Do List</h1>
      <div class="controls">
        <div class="lang-dropdown" id="langDropdown">
            <button class="lang-dropdown-btn" id="langToggle">
              <span id="currentLangText">EN</span>
              <span class="lang-arrow">▾</span>
            </button>
            <div class="lang-dropdown-menu hidden" id="langMenu">
              <div class="lang-option" data-lang="en">English</div>
              <div class="lang-option" data-lang="ru">Русский</div>
              <div class="lang-option" data-lang="kaa">Qaraqalpaqsha</div>
            </div>
          </div>
        <button id="themeToggle" class="theme-toggle-btn" title="Toggle theme">🌙</button>
        <button id="logoutBtn" class="danger hidden" data-i18n="logout">Logout</button>
      </div>
    </div>

    <div id="authBlock" class="auth-section">
      <div class="auth-form">
        <input type="email" id="email" placeholder="Email" autocomplete="email" />
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
        <button id="signInBtn" data-i18n="signIn">Sign In</button>
        <button id="signUpBtn" data-i18n="signUp">Sign Up</button>
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
            <hr style="flex: 1;" />
            <span style="color: var(--text-secondary); font-size: 0.85rem;">or</span>
            <hr style="flex: 1;" />
          </div>
          <button id="googleSignInBtn" class="google-btn">Sign in with Google</button>
      </div>
      <footer class="app-footer">
        <span>created by <a href="https://github.com/eluva" target="_blank" rel="noopener noreferrer">eluva</a></span>
      </footer>
    </div>

    <div id="appBlock" class="hidden">
      <div class="folders-section">
        <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.7rem;">
            <strong data-i18n="folders">Folders</strong>
            <button id="addFolderBtn" class="add-folder-btn" title="Add folder">📁</button>
          </div>
          <div id="folderList" class="folder-list"></div>
      </div>
      <hr />
      <div id="tasksBlock" class="tasks-section hidden">
        <div class="task-form">
          <input type="text" id="taskInput" data-i18n-placeholder="taskPlaceholder" />
          <button id="addTaskBtn" data-i18n="addTask">Add</button>
        </div>
        <div id="taskList"></div>
      </div>
    </div>
  </div>

    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-box">
        <p id="modalMessage"></p>
        <input type="text" id="modalInput" class="modal-input hidden" />
        <div id="modalColorPicker" class="modal-color-picker hidden">
          <p>Border color</p>
          <div class="color-options" id="colorOptions"></div>
        </div>
        <div id="modalButtons" class="modal-buttons"></div>
        </div>
    </div>


    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
      <div class="spinner"></div>
    </div>

  <script src="locales.js"></script>
  <script src="app.js"></script>


</div>
</body>
</html>
